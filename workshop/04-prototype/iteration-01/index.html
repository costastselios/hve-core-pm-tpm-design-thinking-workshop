<!doctype html><meta charset="utf-8"><style>body{font-family:Arial;background:#eee;color:#222}.app{max-width:850px;margin:auto}.card{background:#fff;border:2px solid #666;padding:16px;margin:12px}button{padding:10px;margin:4px}.s{display:none}.on{display:block}.msg{padding:10px;background:#f6f6f6;margin:8px}</style><main class="app" id="a"><button id="restart">Restart</button><section id="setup" class="s on"><div class="card"><h2>Establish portfolio</h2><button id="stmt">Use workshop statement</button><div id="parsed" hidden><button data-go="portfolio">Create portfolio</button></div></div></section><section id="portfolio" class="s"><div class="card"><h2>Portfolio</h2><p>Current standing: consolidated. Historical direction: rising.</p><button data-go="holding">Open holding</button></div></section><section id="holding" class="s"><div class="card"><h2>Holding</h2><button id="prov">Inspect valuation</button><button data-go="tx">Add transaction</button><div id="pv" hidden class="msg">Completed-market valuation and FX provenance available.</div><div id="mm" hidden class="msg">Mismatch detected. <button data-go="recover">Resolve</button></div></div></section><section id="tx" class="s"><div class="card"><button id="save">Save transaction</button><button data-go="import">Continue to import</button></div></section><section id="import" class="s"><div class="card"><button id="load">Use workshop activity file</button><div id="review" hidden><button id="confirm">Confirm reviewed import</button></div><div id="done" hidden class="msg">Import applied. <button data-go="holding">Go to holding</button></div></div></section><section id="recover" class="s"><div class="card"><button id="one">Make current state correct</button><button id="two">Repair history</button><div id="rd" hidden class="msg">Correction recorded.</div></div></section></main><script>(()=>{const r=document.querySelector('#a'),s=[...r.querySelectorAll('.s')];const go=id=>s.forEach(x=>x.classList.toggle('on',x.id===id));r.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));r.querySelector('#restart').onclick=()=>location.reload();r.querySelector('#stmt').onclick=()=>r.querySelector('#parsed').hidden=false;r.querySelector('#prov').onclick=()=>r.querySelector('#pv').hidden=false;r.querySelector('#save').onclick=()=>go('import');r.querySelector('#load').onclick=()=>r.querySelector('#review').hidden=false;r.querySelector('#confirm').onclick=()=>{r.querySelector('#done').hidden=false;r.querySelector('#mm').hidden=false};['#one','#two'].forEach(q=>r.querySelector(q).onclick=()=>r.querySelector('#rd').hidden=false);})();</script>
