<!doctype html><meta charset="utf-8"><style>body{font-family:Arial;background:#eee;color:#222}.app{max-width:850px;margin:auto}.card{background:#fff;border:2px solid #666;padding:16px;margin:12px}button{padding:10px;margin:4px}.s{display:none}.on{display:block}.msg{padding:10px;background:#f6f6f6;margin:8px}</style><main class="app" id="a"><section id="e" class="s on"><div class="card"><h2>We found a mismatch</h2><p><b>New evidence says:</b> a different current quantity.</p><p><b>Your portfolio currently says:</b> the recorded quantity is higher.</p><p><b>Why flagged:</b> both cannot describe today's holding.</p><p>The data does not show the cause yet.</p><button data-go="c">Continue</button></div></section><section id="c" class="s"><button data-mode="known">I know the missing activity</button><button data-mode="unknown">I only know today's correct holding</button></section><section id="p" class="s"><p id="chg"></p><p id="same"></p><p id="unc"></p><button id="ok">Confirm</button><button data-go="c">Back</button></section><section id="d" class="s"><p id="res"></p><button data-go="c">Try other branch</button><button data-go="e">Restart</button></section></main><script>(()=>{const r=document.querySelector('#a'),ss=[...r.querySelectorAll('.s')];let m='';const go=id=>ss.forEach(x=>x.classList.toggle('on',x.id===id));r.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));r.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{m=b.dataset.mode;if(m==='known'){chg.textContent='Will change: record missing activity and recalculate affected history.';same.textContent='Will not change: unrelated holdings.';unc.textContent='May remain uncertain: unexplained evidence.'}else{chg.textContent="Will change: verify today's holding.";same.textContent='Will not change: historical transactions.';unc.textContent='Will remain uncertain: historical cause/completeness.'}go('p')});r.querySelector('#ok').onclick=()=>{res.textContent=m==='known'?'Missing activity recorded; uncertainty remains visible.':"Today's holding verified; historical uncertainty remains explicit.";go('d')}})();</script>
